<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEOFORGE — computational oncology research explorer</title>
<meta name="description" content="Interactive research explorer for personalised neoantigen discovery. Renders projections of hashed pipeline artifacts only.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f14'/%3E%3Cpath d='M9 24V8l14 16V8' stroke='%232dd4bf' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="banner" class="banner">
  <strong>Research prototype</strong>
  <span>Computational predictions only — no clinical, diagnostic, or treatment claims.</span>
  <span class="banner-sep">·</span>
  <span>Predicted binding ≠ predicted presentation ≠ demonstrated immunogenicity.</span>
</div>

<div class="shell">
  <nav id="nav" class="nav" aria-label="Views">
    <a class="brand" href="#/overview">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0e1620"/><path d="M9 24V8l14 16V8" stroke="#2dd4bf" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>NEOFORGE</span>
    </a>
    <div class="case-select">
      <label for="casePicker">Research case</label>
      <select id="casePicker" aria-label="Research case selector"></select>
    </div>
    <ul id="navList"></ul>
    <div class="legend" aria-hidden="true">
      <span class="tag l1">L1 measured</span>
      <span class="tag l2">L2 derived</span>
      <span class="tag l3">L3 predicted</span>
      <span class="tag l4">L4 experimental</span>
    </div>
  </nav>

  <main id="app" class="app" tabindex="-1"></main>
</div>

<script src="app.js"></script>
</body>
</html>
